// ── Supabase ──────────────────────────────────────────────────────
async function loadFromDB(){
  setState({loading:true});
  try {
    const {data:rows,error} = await sb.from('dynasty_data').select('id,data');
    if(error || !rows || rows.length===0){ await seedDB(); return; }
    const map = {};
    rows.forEach(r=>{ try{ map[r.id]=typeof r.data==='string'?JSON.parse(r.data):r.data; }catch{map[r.id]=r.data;} });
    const d = JSON.parse(JSON.stringify(DEFAULT_DATA));
    if(map.week) d.week = Number(map.week);
    if(map.season) d.season = Number(map.season);
    if(map.games && Array.isArray(map.games) && map.games.length>0) d.weeklyGames = map.games;
    if(map.rankings && Array.isArray(map.rankings) && map.rankings.length>0) d.cfpRankings = map.rankings;
    if(map.standings && Object.keys(map.standings).length>0) d.conferences = map.standings;
    if(map.schedules) d.schedules = map.schedules;
    setState({data:d, loading:false});
  } catch(e){ console.error(e); setState({loading:false}); }
}

async function seedDB(){
  const d = DEFAULT_DATA;
  await sb.from('dynasty_data').upsert([
    {id:'week',data:d.week},{id:'season',data:d.season},
    {id:'games',data:d.weeklyGames},{id:'rankings',data:d.cfpRankings},
    {id:'standings',data:d.conferences},{id:'schedules',data:d.schedules}
  ]);
  setState({data:JSON.parse(JSON.stringify(d)), loading:false});
}

async function saveToDB(key, value){
  const {error} = await sb.from('dynasty_data').upsert({id:key, data:value, updated_at:new Date().toISOString()});
  if(error) console.error('Save error:', error);
}

// ── CSV helpers ───────────────────────────────────────────────────
function parseCSV(text){
  const [headerLine,...rows] = text.trim().split('\n').filter(r=>r.trim());
  const headers = headerLine.split(',').map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
  return rows.map(row=>{ const vals=row.split(',').map(v=>v.trim()); return Object.fromEntries(headers.map((h,i)=>[h,vals[i]??''])); });
}
function downloadCSV(filename,rows,headers){
  const lines=[headers.join(','),...rows.map(r=>headers.map(h=>r[h]??'').join(','))];
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(lines.join('\n')); a.download=filename; a.click();
}

function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{ if(k==='style'&&typeof v==='object') Object.assign(e.style,v); else if(k.startsWith('on')&&typeof v==='function') e.addEventListener(k.slice(2).toLowerCase(),v); else if(k==='className') e.className=v; else if(k==='htmlFor') e.htmlFor=v; else e.setAttribute(k,v); });
  children.flat().forEach(c=>{ if(c==null||c===false) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

function csvBar(hint, onDownload, onUpload){
  const label = el('label',{className:'btn-primary',style:{fontSize:12,padding:'6px 14px',borderRadius:7,cursor:'pointer'}}, '⬆ Upload CSV');
  const input = el('input',{type:'file',accept:'.csv',style:{display:'none'}});
  input.addEventListener('change', e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{onUpload(parseCSV(ev.target.result));}catch{showToast('CSV parse error');} }; r.readAsText(f); e.target.value=''; });
  label.appendChild(input);
  return el('div',{className:'csv-bar'},
    el('span',{className:'csv-hint'},hint),
    el('button',{className:'btn-ghost',style:{fontSize:12,padding:'6px 14px',borderRadius:7},onclick:onDownload},'⬇ Template'),
    label
  );
}

      el('span',{style:{fontSize:11,fontWeight:700,color:finished?C.accent:C.green,letterSpacing:.5,textTransform:'uppercase'}},finished?'Final':'Upcoming')

    const body = el('div',{style:{padding:'16px'}});

    if(finished) awayRow.appendChild(el('div',{style:{fontSize:32,fontWeight:800,fontFamily:"'Syne',sans-serif",color:awayWin?C.accent:C.textLight}},String(game.awayScore)));
    const divider = el('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'4px 10px'}},

  frag.appendChild(sel);

    const card = el('div',{className:'card'});
    const hdr = el('div',{className:'table-header',style:{display:'grid',gridTemplateColumns:'70px 1fr 130px',gap:8}});

        el('div',{style:{fontSize:14,fontWeight:700,color:g.week===data.week?C.accent:C.textLight}},String(g.week)),

function inputEl(value, onChange, opts={}){
  const i = el('input',{className:'admin-input input',style:{width:opts.width||'100%',...(opts.style||{})},type:opts.type||'text',placeholder:opts.placeholder||''});
  i.value = value ?? '';
  i.addEventListener('input', e=>onChange(e.target.value));
  return i;
}
function fieldGroup(label, inputElem){ return el('div',{},el('div',{className:'field-label'},label),inputElem); }

function renderAdminGames(){
  const {editGames,editWeek,editSeason,newGame,data} = state;
  const frag = el('div',{});

  // CSV bar
  frag.appendChild(csvBar(
    'Columns: away, home, away_score, home_score, spread, over_under, time',
    ()=>downloadCSV('games.csv', editGames.map(g=>({away:g.away,home:g.home,away_score:g.awayScore??'',home_score:g.homeScore??'',spread:g.spread,over_under:g.overUnder,time:g.time})),['away','home','away_score','home_score','spread','over_under','time']),
    rows=>{
      const updated = editGames.map(game=>{
        const m = rows.find(r=>r.away?.toLowerCase()===game.away.toLowerCase()&&r.home?.toLowerCase()===game.home.toLowerCase());
        if(!m) return game;
        return {...game, awayScore:m.away_score!==''?Number(m.away_score):game.awayScore, homeScore:m.home_score!==''?Number(m.home_score):game.homeScore, spread:m.spread||game.spread, overUnder:m.over_under||game.overUnder, time:m.time||game.time};
      });

    }
  ));

  // Week/Season

  // Add game

    );

    [['Away Score','awayScore',80,'number'],['Home Score','homeScore',80,'number'],['Spread','spread',160,'text'],['O/U','overUnder',80,'text'],['Time','time',120,'text']].forEach(([label,field,w,type])=>{
      row.appendChild(fieldGroup(label, inputEl(game[field]??'', v=>{ const g=[...state.editGames]; g[i]={...g[i],[field]:type==='number'?(v===''?null:Number(v)):v}; setState({editGames:g}); }, {width:w,type,placeholder:'—'})));

function renderAdminSchedules(){
  const {data,scheduleTeam} = state;
  const allTeams = Object.values(data.conferences).flatMap(c=>c.teams.map(t=>t.name)).sort();
  const frag = el('div',{});
  frag.appendChild(csvBar(
    'Columns: team, week, opponent, result',
    ()=>{ const rows=Object.entries(data.schedules).flatMap(([team,weeks])=>weeks.map(g=>({team,week:g.week,opponent:g.opponent,result:g.result||''}))); downloadCSV('schedules.csv',rows,['team','week','opponent','result']); },
    rows=>{
      const next={...data.schedules};
      rows.forEach(r=>{ if(!r.team||!r.week)return; const team=Object.keys(next).find(t=>t.toLowerCase()===r.team.toLowerCase())||r.team; if(!next[team])next[team]=[]; const ex=next[team].find(g=>String(g.week)===String(r.week)); if(ex){if(r.opponent)ex.opponent=r.opponent;if(r.result)ex.result=r.result;}else next[team].push({week:Number(r.week),opponent:r.opponent,result:r.result||null}); next[team].sort((a,b)=>a.week-b.week); });
      const newData={...data,schedules:next}; saveToDB('schedules',next); setState({data:newData}); showToast('Schedules updated!');
    }
  ));
  const sel = el('select',{className:'input',style:{padding:'10px 16px',fontSize:14,minWidth:230,cursor:'pointer',marginBottom:16}});
  sel.appendChild(el('option',{value:''},'Select a team…'));
  allTeams.forEach(t=>{ const o=el('option',{value:t},t); if(t===scheduleTeam)o.selected=true; sel.appendChild(o); });
  sel.addEventListener('change',e=>setState({scheduleTeam:e.target.value}));
  frag.appendChild(sel);
  if(scheduleTeam){
    const card = el('div',{className:'card',style:{marginBottom:16}});
    const hdr = el('div',{style:{display:'grid',gridTemplateColumns:'60px 1fr 150px 60px',gap:8,padding:'10px 16px',background:C.accent}});
    ['Wk','Opponent','Result',''].forEach(h=>hdr.appendChild(el('span',{style:{fontSize:11,color:'rgba(255,255,255,.85)',fontWeight:700}},h)));
    card.appendChild(hdr);
    (data.schedules[scheduleTeam]||[]).forEach((game,i)=>{
      const row = el('div',{style:{display:'grid',gridTemplateColumns:'60px 1fr 150px 60px',gap:8,padding:'8px 16px',borderBottom:`1px solid ${C.border}`,alignItems:'center'}});
      row.append(
        el('div',{style:{fontSize:14,fontWeight:700,color:C.textLight}},String(game.week)),
        inputEl(game.opponent, v=>{ const s=JSON.parse(JSON.stringify(data.schedules)); s[scheduleTeam][i].opponent=v; const nd={...data,schedules:s}; saveToDB('schedules',s); setState({data:nd}); }),
        inputEl(game.result||'', v=>{ const s=JSON.parse(JSON.stringify(data.schedules)); s[scheduleTeam][i].result=v||null; const nd={...data,schedules:s}; saveToDB('schedules',s); setState({data:nd}); }, {placeholder:'W 35-21'}),
        el('button',{style:{background:C.accentLight,border:`1px solid ${C.accentMid}`,color:C.accent,padding:'5px 8px',borderRadius:6,cursor:'pointer',fontSize:11,fontWeight:700},onclick:()=>{ const s=JSON.parse(JSON.stringify(data.schedules)); s[scheduleTeam].splice(i,1); const nd={...data,schedules:s}; saveToDB('schedules',s); setState({data:nd}); }},'Del')
      );
      card.appendChild(row);
    });
    frag.appendChild(card);
    frag.appendChild(el('button',{className:'btn-primary',style:{background:C.text},onclick:()=>{ const s=JSON.parse(JSON.stringify(data.schedules)); if(!s[scheduleTeam])s[scheduleTeam]=[]; s[scheduleTeam].push({week:(s[scheduleTeam].length||0)+1,opponent:'vs TBD',result:null}); s[scheduleTeam].sort((a,b)=>a.week-b.week); const nd={...data,schedules:s}; saveToDB('schedules',s); setState({data:nd}); }},'+ Add Week'));
  }
  return frag;
}

// ── Login modal ───────────────────────────────────────────────────
function renderLoginModal(){
  const backdrop = el('div',{className:'modal-backdrop',onclick:e=>{ if(e.target===backdrop) setState({showLogin:false,pwInput:'',pwError:false}); }});
  const modal = el('div',{className:'modal'});
  modal.appendChild(el('div',{style:{fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:700,marginBottom:4}},'Admin Login'));
  modal.appendChild(el('div',{style:{fontSize:13,color:'#999',marginBottom:22}},'Enter your password to edit dynasty data'));
  const pw = el('input',{className:'input',style:{width:'100%',padding:'11px 14px',fontSize:14,marginBottom:10,border:`1.5px solid ${state.pwError?'#CC1122':'#E8E6E0'}`,borderRadius:6},type:'password',placeholder:'Password'});
  pw.value = state.pwInput;
  pw.addEventListener('input',e=>{ state.pwInput=e.target.value; state.pwError=false; });
  pw.addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });
  modal.appendChild(pw);
  if(state.pwError) modal.appendChild(el('div',{style:{color:'#CC1122',fontSize:12,marginBottom:10}},'Incorrect password'));
  const btns = el('div',{style:{display:'flex',gap:10}});
  btns.append(
    el('button',{className:'btn-primary',style:{flex:1,padding:11},onclick:tryLogin},'Login'),
    el('button',{className:'btn-ghost',style:{flex:1,padding:11},onclick:()=>setState({showLogin:false,pwInput:'',pwError:false})},'Cancel')
  );
  modal.appendChild(btns);
  backdrop.appendChild(modal);
  setTimeout(()=>{ const inp=backdrop.querySelector('input[type=password]'); if(inp)inp.focus(); },50);
  return backdrop;
}

function tryLogin(){
  if(state.pwInput===ADMIN_PASSWORD){
    setState({isAdmin:true,showLogin:false,pwInput:'',pwError:false,editGames:JSON.parse(JSON.stringify(state.data.weeklyGames)),editRankings:JSON.parse(JSON.stringify(state.data.cfpRankings)),editStandings:JSON.parse(JSON.stringify(state.data.conferences)),editWeek:state.data.week,editSeason:state.data.season});
  } else { setState({pwError:true}); }
}
